name: Publish paper and browser demo

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/paper/*.pdf'
      - 'docs/project/**'
      - 'simulation/browser/**'
      - '.github/workflows/browser-demo.yml'
      - 'simulation/LICENSE'
      - 'simulation/NOTICE'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            docs/project
            docs/paper
            simulation/browser
      - name: Fetch site media and test the released actor
        run: |
          git lfs install --local
          git lfs pull --include="docs/project/media/**,simulation/browser/bowl/media/bowl-policy.mp4" --exclude=""
          node simulation/browser/bowl/check.mjs
      - name: Prepare the static site
        run: docs/project/build.sh "$RUNNER_TEMP/mc-dex-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/mc-dex-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the project site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
